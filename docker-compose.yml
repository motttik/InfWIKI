version: '3.8'

services:
  infwiki:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: infwiki-app
    ports:
      - "3000:3000"
    environment:
      - NODE_ENV=production
      - VITE_GEMINI_API_KEY=${GEMINI_API_KEY:-}
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "node", "-e", "require('http').get('http://localhost:3000', (r) => {process.exit(r.statusCode === 200 ? 0 : 1)})"]
      interval: 30s
      timeout: 3s
      retries: 3
      start_period: 10s
    networks:
      - infwiki-network

  # Development service with hot reload
  dev:
    image: node:20-alpine
    container_name: infwiki-dev
    working_dir: /app
    volumes:
      - .:/app
      - /app/node_modules
    ports:
      - "3000:3000"
    environment:
      - NODE_ENV=development
      - VITE_GEMINI_API_KEY=${GEMINI_API_KEY:-}
    command: sh -c "npm install && npm run dev -- --host 0.0.0.0"
    profiles:
      - dev
    networks:
      - infwiki-network

networks:
  infwiki-network:
    driver: bridge
